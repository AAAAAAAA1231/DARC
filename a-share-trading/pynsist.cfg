[Application]
name=大A量化研判系统
version=0.1.0
publisher=A-Share Research
entry_point=a_share_trading.desktop:main
console=false

[Python]
version=3.12.10
bitness=64
format=bundled

[Include]
pypi_wheels =
    fastapi==0.141.1
    starlette==1.6.0
    uvicorn==0.52.4
    pydantic==2.13.4
    pydantic_core==2.46.4
    annotated-types==0.7.0
    typing-extensions==4.15.0
    typing-inspection==0.4.2
    anyio==4.12.1
    h11==0.16.0
    click==8.3.1
    colorama==0.4.6
    idna==3.11
    sniffio==1.3.1
    jinja2==3.1.6
    MarkupSafe==3.0.2
packages = a_share_trading
files = web/
    data/universe.json > $INSTDIR\data
    data/calibration.json > $INSTDIR\data
    data/predictions.json > $INSTDIR\data

[Build]
directory = build/nsis
installer_name = 大A量化研判系统.exe
