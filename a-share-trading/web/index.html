<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>大A量化研判系统</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">A</div>
      <div>
        <h1>大A量化研判系统</h1>
        <p class="tag">全市场 · 32 方法加权 · 止盈止损 · 百亿次模拟校正</p>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
  </header>

  <main>
    <section class="panel">
      <div class="toolbar">
        <input id="q" type="search" placeholder="搜索代码 / 名称" />
        <select id="direction">
          <option value="">全部方向</option>
          <option value="上涨">上涨</option>
          <option value="下跌">下跌</option>
          <option value="震荡">震荡</option>
        </select>
        <select id="board">
          <option value="">全部市场</option>
          <option value="上证">上证</option>
          <option value="深证">深证</option>
          <option value="科创板">科创板</option>
          <option value="创业板">创业板</option>
          <option value="北交所">北交所</option>
        </select>
        <select id="sort">
          <option value="score">按信号强度</option>
          <option value="confidence">按置信度</option>
          <option value="change_pct">按涨跌幅</option>
          <option value="mktcap">按市值</option>
        </select>
        <div class="pager">
          <button id="prev" type="button">上一页</button>
          <span id="pageinfo">1 / 1</span>
          <button id="next" type="button">下一页</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>代码</th>
              <th>名称</th>
              <th>市场</th>
              <th>现价</th>
              <th>涨跌幅</th>
              <th>走势</th>
              <th>强度</th>
              <th>置信度</th>
              <th>止盈</th>
              <th>止损</th>
              <th>数据</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>

    <aside class="side">
      <section class="card" id="detail">
        <h2>个股研判</h2>
        <p class="muted">点击表格中的股票查看方法拆解与止盈止损。</p>
      </section>
      <section class="card">
        <h2>方法权重（模拟校正后）</h2>
        <div id="weights"></div>
      </section>
    </aside>
  </main>

  <footer>
    本系统为量化研究工具，综合均线、MACD、KDJ、RSI、布林、海龟、量价等已知常用方法做加权平均，并用蒙特卡洛模拟修正权重。
    <strong>不构成任何投资建议，模拟与历史回测不能代表未来收益。</strong>
    A 股交易受 T+1、涨跌停与适当性管理约束。
  </footer>
  <script src="/assets/app.js"></script>
</body>
</html>
