[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-trading"
version = "0.1.0"
description = "A-share ensemble trend, take-profit/stop-loss, and Monte Carlo calibration system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "jinja2>=3.1",
  "numba>=0.59",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
a-share = "a_share_trading.cli:main"

[tool.setuptools.packages.find]
include = ["a_share_trading*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
