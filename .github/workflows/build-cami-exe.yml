name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/crypto-ai-master-intelligence-11d9
    paths:
      - "Crypto-AI-Master-Intelligence/**"
      - ".github/workflows/build-cami-exe.yml"

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Crypto-AI-Master-Intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python deps
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt pyinstaller pywebview
      - name: Frontend
        working-directory: Crypto-AI-Master-Intelligence/frontend
        run: |
          npm install
          npm run build
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean Crypto-AI-Master-Intelligence.spec
      - name: Publish Crypto-AI-Master-Intelligence.exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cami-windows-exe
          name: Crypto-AI-Master-Intelligence.exe
          body: |
            Direct Windows EXE (not a zip).
            Put `.env` next to the EXE if you have keys. Missing keys are fine.
            SQLite and logs are created beside the EXE. No live trading. No private keys in the binary.
          files: Crypto-AI-Master-Intelligence/dist/Crypto-AI-Master-Intelligence.exe
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
