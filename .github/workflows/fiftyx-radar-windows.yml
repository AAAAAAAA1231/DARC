name: Fifty-X Radar Windows exe

on:
  workflow_dispatch:
  push:
    paths:
      - "fiftyx-radar/**"
      - ".github/workflows/fiftyx-radar-windows.yml"

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build OneFile exe
        working-directory: fiftyx-radar
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --console --name FiftyXRadar --hidden-import radar --hidden-import radar.models --hidden-import radar.scoring --hidden-import radar.sources --hidden-import radar.report --hidden-import radar.__main__ fiftyx_radar.py
      # Attach to the existing Latest release (chainradar), same as ChainRadar.exe.
      # Do not set name/body/prerelease or the ChainRadar release page gets overwritten.
      - name: Attach FiftyXRadar.exe to Latest release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chainradar
          files: fiftyx-radar/dist/FiftyXRadar.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
