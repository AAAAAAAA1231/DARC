name: Build AShareQuant Windows EXE

on:
  push:
    paths:
      - "ashare-quant/**"
      - ".github/workflows/ashare-quant-windows.yml"
  pull_request:
    paths:
      - "ashare-quant/**"
      - ".github/workflows/ashare-quant-windows.yml"
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ashare-quant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and PyInstaller
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[packaging]"
      - name: Build one-file EXE
        run: python -m PyInstaller --noconfirm --clean AShareQuant.spec
      - name: Verify EXE
        run: |
          if (-not (Test-Path dist/AShareQuant.exe)) { throw "AShareQuant.exe missing" }
          $item = Get-Item dist/AShareQuant.exe
          Write-Host ("EXE bytes={0} MB={1:N1}" -f $item.Length, ($item.Length/1MB))
          $item | Format-List Name, Length, FullName
      - uses: actions/upload-artifact@v4
        with:
          name: AShareQuant-windows
          path: ashare-quant/dist/AShareQuant.exe
          if-no-files-found: error
          retention-days: 14
