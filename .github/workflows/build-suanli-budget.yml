name: Build SuanliBudget EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "suanli-budget/**"
      - ".github/workflows/build-suanli-budget.yml"

jobs:
  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: suanli-budget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Test
        run: python -m pytest tests -q
      - name: Build EXE
        run: pyinstaller --noconfirm SuanliBudget.spec
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SuanliBudget-windows
          path: suanli-budget/dist/SuanliBudget.exe
