name: Build ChainRadar EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "web3-radar/**"
      - ".github/workflows/build-web3-radar.yml"

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web3-radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Test
        run: python -m pytest tests -q
      - name: Build EXE
        run: pyinstaller --noconfirm ChainRadar.spec
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ChainRadar-windows
          path: web3-radar/dist/ChainRadar.exe
      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chainradar
          name: 链上雷达 ChainRadar
          target_commitish: ${{ github.sha }}
          files: web3-radar/dist/ChainRadar.exe
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            直接点下面的 **ChainRadar.exe** 就会下载，不要点仓库文件旁的小箭头。

            或把这行粘贴到浏览器地址栏回车：
            https://github.com/AAAAAAAA1231/DARC/releases/latest/download/ChainRadar.exe
