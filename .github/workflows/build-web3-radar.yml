name: Build ChainRadar EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "web3-radar/**"
      - ".github/workflows/build-web3-radar.yml"

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web3-radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test
        run: python -m pytest tests -q
      - name: Build custom PyInstaller bootloader
        working-directory: .
        run: |
          git clone --depth 1 --branch v6.14.1 https://github.com/pyinstaller/pyinstaller.git "$env:RUNNER_TEMP\pyinstaller"
          Set-Location "$env:RUNNER_TEMP\pyinstaller\bootloader"
          python ./waf distclean all --target-arch=64bit
          Set-Location "$env:RUNNER_TEMP\pyinstaller"
          pip install .
      - name: Build EXE
        run: pyinstaller --noconfirm ChainRadar.spec
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ChainRadar-windows
          path: web3-radar/dist/ChainRadar.exe
      - name: Drop zip-only release leftover
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: gh release delete-asset chainradar ChainRadar.zip --yes --repo ${{ github.repository }}
      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chainradar
          name: 链上雷达 ChainRadar
          target_commitish: ${{ github.sha }}
          files: web3-radar/dist/ChainRadar.exe
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            直接点下面的 **ChainRadar.exe** 就会下载，不要点仓库文件旁的小箭头。

            或把这行粘贴到浏览器地址栏回车：
            https://github.com/AAAAAAAA1231/DARC/releases/latest/download/ChainRadar.exe
