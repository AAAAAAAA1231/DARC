name: Build ChainRadar EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "web3-radar/**"
      - ".github/workflows/build-web3-radar.yml"

jobs:
  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web3-radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Test
        run: python -m pytest tests -q
      - name: Build EXE
        run: pyinstaller --noconfirm ChainRadar.spec
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ChainRadar-windows
          path: web3-radar/dist/ChainRadar.exe
