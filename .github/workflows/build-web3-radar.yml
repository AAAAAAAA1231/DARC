name: Build ChainRadar EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "web3-radar/**"
      - ".github/workflows/build-web3-radar.yml"

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web3-radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Test
        run: python -m pytest tests -q
      - name: Build portable folder
        run: pyinstaller --noconfirm ChainRadar.spec
      - name: Zip portable folder
        run: |
          Copy-Item -Force packaging\使用说明.txt dist\ChainRadar\使用说明.txt
          if (Test-Path dist\ChainRadar.zip) { Remove-Item dist\ChainRadar.zip }
          Compress-Archive -Path dist\ChainRadar -DestinationPath dist\ChainRadar.zip -CompressionLevel Optimal
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ChainRadar-windows
          path: web3-radar/dist/ChainRadar.zip
      - name: Drop old single-file EXE from release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          $ids = gh release view chainradar --repo ${{ github.repository }} --json assets --jq '.assets[] | select(.name=="ChainRadar.exe") | .id' 2>$null
          foreach ($id in $ids) {
            if ($id) { gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" }
          }
      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chainradar
          name: 链上雷达 ChainRadar
          target_commitish: ${{ github.sha }}
          files: web3-radar/dist/ChainRadar.zip
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            请下载 **ChainRadar.zip**，解压后进入文件夹，双击 `ChainRadar.exe`。
            不要只把 exe 单独拷走，也不要点仓库文件旁的小箭头。

            粘贴到浏览器地址栏回车：
            https://github.com/AAAAAAAA1231/DARC/releases/latest/download/ChainRadar.zip
