name: Build ChengBen EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "chengben/**"
      - ".github/workflows/build-chengben.yml"

jobs:
  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: chengben
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Test
        run: python -m pytest tests -q
      - name: Build EXE
        run: pyinstaller --noconfirm ChengBen.spec
      - name: Pack zip
        run: |
          python -c "import zipfile; z=zipfile.ZipFile('dist/ChengBen.zip','w',zipfile.ZIP_DEFLATED); z.write('dist/ChengBen.exe','ChengBen.exe'); z.write('打开说明.txt','ReadMe.txt')"
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ChengBen-windows
          path: |
            chengben/dist/ChengBen.exe
            chengben/dist/ChengBen.zip
