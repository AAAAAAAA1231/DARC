name: Build Market Open Advisor EXE

on:
  push:
    paths:
      - "market-open-advisor/**"
      - ".github/workflows/build-market-open-advisor.yml"
  pull_request:
    paths:
      - "market-open-advisor/**"
      - ".github/workflows/build-market-open-advisor.yml"

jobs:
  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: market-open-advisor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller numpy
          python -m PyInstaller --noconfirm --clean packaging/OpenAdvisor.spec
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: OpenAdvisor-windows
          path: market-open-advisor/dist/OpenAdvisor.exe
