name: Build GongCheng EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "gongcheng/**"
      - ".github/workflows/build-gongcheng.yml"

jobs:
  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gongcheng
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Test
        run: python -m pytest tests -q
      - name: Build EXE
        run: pyinstaller --noconfirm GongCheng.spec
      - name: Pack zip
        run: python pack_zip.py
      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: GongCheng-windows
          path: gongcheng/dist/GongCheng.zip
