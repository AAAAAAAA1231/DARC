name: Build Football Predictor EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "football-predictor/**"
      - ".github/workflows/build-football-predictor.yml"

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: football-predictor
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyinstaller pytest
      - name: Run unit tests
        working-directory: football-predictor
        run: python -m pytest tests -q
      - name: Build onefile EXE
        working-directory: football-predictor
        run: pyinstaller --noconfirm football_predictor.spec
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: football-predictor-windows
          path: football-predictor/dist/*
