<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>装修排版神器</title>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <header class="top">
    <div>
      <h1>装修排版神器</h1>
      <p>地砖 · 墙砖 · 吊顶 · 家具　按施工规范自动排版　CAD / PDF / 文字均可　完全离线</p>
    </div>
    <div>
      <span class="badge">离线 · GB 50210 / 50327</span>
      <span class="status" id="statusLine">就绪</span>
    </div>
  </header>
  <main>
    <div class="card hint">
      输入房间：可打字（如「卫生间 2.2x1.8 墙砖 300x600」）、上传 CAD（.dxf）或 PDF。
      排版会自动找边砖，避免小于整砖 1/3；吊顶按主龙骨≤1m、次龙骨 300～400、吊杆距墙≤300 排布。成品须现场复核。
    </div>
    <div class="modes" id="tasks">
      <button class="mode on" data-t="floor"><b>地砖排版</b><span>正铺 / 工字 / 斜铺</span></button>
      <button class="mode" data-t="wall"><b>墙砖排版</b><span>四面展开、门洞套割</span></button>
      <button class="mode" data-t="ceiling"><b>吊顶排版</b><span>石膏板 / 铝扣板龙骨</span></button>
      <button class="mode" data-t="furniture"><b>家具布置</b><span>通道与间距校核</span></button>
    </div>
    <div class="layout">
      <section class="card side">
        <h2>1. 输入</h2>
        <label>语言描述
          <textarea id="text">客厅 4.8x6.2 层高2.8米，铺 800x800 抛光砖，正铺十字缝。</textarea>
        </label>
        <label>或上传 CAD / PDF
          <input id="file" type="file" accept=".dxf,.pdf,.txt" />
        </label>
        <div class="grid2">
          <label>房间
            <select id="room_kind">
              <option value="">自动识别</option>
              <option>客厅</option><option>卧室</option><option>餐厅</option>
              <option>厨房</option><option>卫生间</option><option>走廊</option>
            </select>
          </label>
          <label>铺法
            <select id="pattern">
              <option value="straight">正铺十字缝</option>
              <option value="brick">工字/1/3 错缝</option>
              <option value="diagonal">斜铺 45°</option>
            </select>
          </label>
          <label>开间 m <input id="width" type="number" step="0.01" placeholder="可空，用描述/图纸" /></label>
          <label>进深 m <input id="depth" type="number" step="0.01" /></label>
          <label>层高 m <input id="height" type="number" step="0.01" placeholder="2.8" /></label>
          <label>地砖 <select id="floor_tile"></select></label>
          <label>墙砖 <select id="wall_tile"></select></label>
          <label>吊顶 <select id="ceiling"></select></label>
        </div>
        <div class="row">
          <button class="btn primary" id="run">开始排版</button>
          <a class="btn" href="/api/download/svg">SVG</a>
          <a class="btn" href="/api/download/dxf">DXF</a>
          <a class="btn" href="/api/download/zip">下载 ZIP</a>
        </div>
        <h2 style="margin-top:16px">2. 规范校核</h2>
        <div id="checks"></div>
        <h2>3. 工程量</h2>
        <table id="qty"></table>
      </section>
      <section class="card view">
        <div class="viewbar"><span id="titleLine">排版图</span><span class="muted" id="srcLine"></span></div>
        <div id="preview"></div>
      </section>
    </div>
  </main>
  <script src="/static/js/app.js"></script>
</body>
</html>
