[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-open-advisor"
version = "1.0.0"
description = "Open-time stock-market advice by trading venue, using a 10-billion simulation limit"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
open-advisor = "market_advisor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
